<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#07589d">
  <meta name="description" content="مفتاح العام الجديد — رحلة تفاعلية من خمس محطات للطالبة.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="مفتاح العام الجديد">
  <title>مفتاح العام الجديد</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="apple-touch-icon" href="./assets/icons/apple-touch-icon.png">
  <link rel="stylesheet" href="./app.css">
</head>
<body>
  <main id="app" aria-live="polite">
    <section id="artScreen" class="art-screen" aria-label="مفتاح العام الجديد">
      <div id="stage" class="stage">
        <img id="screenImage" class="screen-image" src="./assets/screens/home.webp" alt="واجهة مفتاح العام الجديد">
        <div id="fxLayer" class="fx-layer" aria-hidden="true"></div>
        <div id="overlayRoot" class="overlay-root"></div>

        <div id="welcome" class="welcome-layer">
          <div class="welcome-card" role="dialog" aria-modal="true" aria-labelledby="welcomeTitle">
            <div class="welcome-key">🔑</div>
            <h1 id="welcomeTitle">مرحبًا بكِ في مفتاح العام الجديد</h1>
            <p>اكتبي اسمكِ ثم ابدئي رحلتكِ عبر المحطات الخمس.</p>
            <label for="studentName">اسم الطالبة</label>
            <input id="studentName" autocomplete="name" maxlength="40" placeholder="اكتبي اسمك هنا">
            <button id="startJourney" type="button">ابدئي الرحلة ✨</button>
          </div>
        </div>

        <div id="toast" class="toast" role="status"></div>
      </div>
    </section>

    <section id="freeScreen" class="free-screen is-hidden" aria-live="polite"></section>
  </main>

  <script src="./app.js"></script>
</body>
</html>
